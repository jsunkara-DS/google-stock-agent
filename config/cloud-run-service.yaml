apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: stock-agent
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "0"
    spec:
      serviceAccountName: stock-agent
      containers:
        - image: gcr.io/PROJECT_ID/stock-agent:latest
          ports:
            - containerPort: 8000
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stock-agent-secrets
                  key: gemini-api-key
            - name: ALPHA_VANTAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stock-agent-secrets
                  key: alpha-vantage-api-key
            - name: STOCKS_TO_MONITOR
              value: "AAPL,MSFT,GOOGL,AMZN,NVDA"
            - name: ENVIRONMENT
              value: "production"
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
